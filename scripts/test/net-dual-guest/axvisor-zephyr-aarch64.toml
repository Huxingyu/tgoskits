# Task-2 dual-guest network baseline: Zephyr with console, GIC and timer only.
# Derived from the day3 minimal-device config. The zephyr-qemu image here is
# the pre-network smoke payload; it is replaced by a network-enabled Zephyr
# build once virtio-net passthrough is wired up.
[base]
id = 2
name = "zephyr-qemu-net-dual"
vm_type = 1
cpu_num = 1
phys_cpu_ids = [3]

[kernel]
entry_point = 0x4000_10a4
image_location = "memory"
kernel_path = "/home/huhu/tgoskits-net/tmp/axbuild/rootfs/qemu-aarch64/zephyr/zephyr-qemu"
kernel_load_addr = 0x4000_0000
dtb_load_addr = 0x47e0_0000
memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
interrupt_mode = "passthrough"
passthrough_devices = [
  ["/pl011@9000000"],
  ["/intc@8000000"],
  ["/timer"],
]
passthrough_addresses = []
excluded_devices = []
emu_devices = []
