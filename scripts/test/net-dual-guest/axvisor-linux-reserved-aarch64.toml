# T3 experiment: Linux with MAP_RESERVED fixed identity (GPA == HPA @ 0x8000_0000).
# This is the DMA-friendly mapping for virtio passthrough; the open question is
# whether the host heap has already claimed 0x8000_0000 by the time this VM is
# created (someboot marks all QEMU RAM as Free).
[base]
id = 1
name = "linux-qemu-net-reserved"
vm_type = 1
cpu_num = 2
phys_cpu_ids = [1, 2]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "/home/huhu/tgoskits-net/tmp/axbuild/rootfs/qemu-aarch64/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
ramdisk_path = "/home/huhu/tgoskits-net/tmp/axbuild/rootfs/initramfs-aarch64-busybox-net.cpio.gz"
ramdisk_load_addr = 0x8800_0000
cmdline = "earlycon=pl011,mmio32,0x09000000 console=ttyAMA0 loglevel=8 rdinit=/bin/task2-init"
dtb_load_addr = 0x8f00_0000
memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 2],
]

[devices]
interrupt_mode = "passthrough"
passthrough_devices = [
  ["/psci"],
  ["/pl011@9000000"],
  ["/intc@8000000"],
  ["/timer"],
]
passthrough_addresses = []
excluded_devices = []
emu_devices = []
