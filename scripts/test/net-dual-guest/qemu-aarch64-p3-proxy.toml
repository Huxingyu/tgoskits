# P3: the two QEMU socket netdevs connect to ack_drop_proxy.py instead of
# directly connecting to one another. The proxy preserves QEMU's length
# framing and drops only the configured T2N1 frame(s).
args = [
  "-nographic",
  "-cpu", "cortex-a72",
  "-machine", "virt,virtualization=on,gic-version=3",
  "-smp", "1",
  "-m", "8g",
  "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append", "root=/dev/nvme0n1 rw init=/bin/sh",
  "-snapshot",
  "-qmp", "unix:${workspace}/tmp/net-dual-guest/qmp-p3.sock,server,nowait",
  "-netdev", "socket,id=net-linux,connect=127.0.0.1:12731",
  "-device", "virtio-net-device,netdev=net-linux,mac=52:54:00:12:34:01",
  "-object", "filter-dump,id=fd-linux,netdev=net-linux,file=${workspace}/tmp/net-dual-guest/linux-p3.pcap",
  "-netdev", "socket,id=net-rtos,connect=127.0.0.1:12732",
  "-device", "virtio-net-device,netdev=net-rtos,mac=52:54:00:12:34:02",
  "-object", "filter-dump,id=fd-rtos,netdev=net-rtos,file=${workspace}/tmp/net-dual-guest/rtos-p3.pcap",
]
fail_regex = []
success_regex = []
to_bin = true
uefi = false
