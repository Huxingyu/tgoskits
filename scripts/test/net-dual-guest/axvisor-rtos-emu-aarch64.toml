# Task-2 RTOS guest (ArceOS UDP echo) with emulated GIC (INTID 49 virtio-net
# path). MAP_RESERVED pins GPA == HPA at the ArceOS link address 0x8020_0000,
# so early boot code before MMU setup does not dereference an unmapped GPA.
[base]
id = 2
name = "arceos-net-emu"
vm_type = 1
cpu_num = 1
phys_cpu_ids = [3]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "/home/huhu/tgoskits-net/tmp/axbuild/rootfs/qemu-aarch64/arceos/arceos-udpecho.bin"
kernel_load_addr = 0x8020_0000
dtb_path = "/home/huhu/tgoskits-net/scripts/test/net-dual-guest/pci-virt.dtb"
dtb_load_addr = 0x8020_0000
memory_regions = [
  [0x8020_0000, 0x0800_0000, 0x7, 2],
]

[devices]
interrupt_mode = "emulated"
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [1, 0x2_0000, 3]],
]
passthrough_devices = [
  ["/pl011@9000000"],
  ["/intc@8000000"],
  ["/timer"],
  ["/virtio_mmio@a000000"],
]
passthrough_addresses = [
  [0x0a00_0000, 0x200],
]
excluded_devices = []
