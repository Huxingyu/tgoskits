args = [
    "-nographic",
    "-m",
    "512M",
    "-cpu",
    "cortex-a53",
    "-machine",
    "virt,gic-version=3",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0,net=10.0.42.0/24,dhcpstart=10.0.42.15",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "sh /usr/bin/t2n1-run.sh"
success_regex = ["(?m)^STARRY_T2N1_PASS\\s*$"]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "(?m)^STARRY_T2N1_FAIL\\b"]
timeout = 120
