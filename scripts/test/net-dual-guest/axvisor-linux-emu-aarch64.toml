# Task-2 Linux guest with emulated GIC (INTID 48 virtio-net path).
# Emulated GIC is the preferred interrupt route: it avoids the shared-physical
# GICD SPI arbitration problem of dual-guest passthrough.
[base]
id = 1
name = "linux-qemu-net-emu"
vm_type = 1
cpu_num = 2
phys_cpu_ids = [1, 2]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "/home/huhu/tgoskits-net/tmp/axbuild/rootfs/qemu-aarch64/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_path = "/home/huhu/tgoskits-net/scripts/test/net-dual-guest/pci-virt.dtb"
ramdisk_path = "/home/huhu/tgoskits-net/tmp/axbuild/rootfs/initramfs-aarch64-busybox-net.cpio.gz"
ramdisk_load_addr = 0x8800_0000
cmdline = "earlycon=pl011,mmio32,0x09000000 console=ttyAMA0 loglevel=8 rdinit=/bin/task2-init"
dtb_load_addr = 0x8f00_0000
memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 0],
]

[devices]
interrupt_mode = "emulated"
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [2, 0x2_0000, 1]],
]
passthrough_devices = [
  ["/pl011@9000000"],
  ["/intc@8000000"],
  ["/timer"],
  ["/virtio_mmio@a000200"],
]
passthrough_addresses = [
  [0x0a00_0200, 0x200],
]
excluded_devices = []
