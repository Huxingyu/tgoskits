# RT-PARTITION: dual-guest real-time partition topology.
#
# Host is QEMU virt with 4 physical CPUs. The topology (T0.4 allocation):
#   pCPU 0 : hypervisor itself, virtio-net switch, shell, housekeeping
#   pCPU 1 : Zephyr RT guest (1 vCPU, dedicated)
#   pCPU 2,3 : Linux guest (2 vCPUs; guest CPU1 further isolated via
#              isolcpus=1 nohz_full=1 irqaffinity=0 for the measurement task)
#
# Serial console via UNIX socket so the Zephyr periodic sampler and the
# Linux kernel log can be captured separately by the runner.
args = [
  "-display", "none",
  "-monitor", "none",
  "-serial", "unix:${workspace}/tmp/rt-partition/serial-rt.sock,server,nowait",
  "-cpu", "cortex-a72",
  "-machine", "virt,virtualization=on,gic-version=3",
  "-smp", "4",
  "-m", "8g",
  "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append", "root=/dev/nvme0n1 rw init=/init",
  "-snapshot",
  "-qmp", "unix:${workspace}/tmp/rt-partition/qmp-rt.sock,server,nowait",
]
fail_regex = ["TASK2_ERROR=", "(?i)panic"]
success_regex = ["PERIODIC_LATENCY_COMPLETE"]
to_bin = true
uefi = false
