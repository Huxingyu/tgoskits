# RT-PARTITION Linux guest: 2 vCPUs pinned to physical CPUs 2 and 3.
#
# Guest CPU 0 runs the cyclictest/stress measurement task; guest CPU 1 is
# isolated from the kernel scheduler (`isolcpus=1 nohz_full=1 irqaffinity=0`)
# so the measurement vCPU has no kernel timers or IRQ affinity to contend
# with. Together with the hypervisor-level pCPU allocation this forms the
# double-layer isolation claimed in the RT partition design.
[base]
id = 1
name = "rt-partition-linux"
guest_type = "virtualized"
cpu_num = 2
phys_cpu_ids = [2, 3]

[kernel]
entry_point = 0x8000_0000
image_location = "memory"
kernel_path = "${workspace}/tmp/rt-partition/linux-qemu"
kernel_load_addr = 0x8000_0000
dtb_load_addr = 0x9F00_0000
ramdisk_path = "${workspace}/tmp/rt-partition/rt-linux-initramfs.cpio.gz"
ramdisk_load_addr = 0x9C00_0000
cmdline = "root=/dev/nvme0n1 rw init=/init isolcpus=1 nohz_full=1 irqaffinity=0"
memory_regions = [[0x8000_0000, 0x2000_0000, 0x7, 0]]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x12, 0x34, 0x01]
