# ArceOS UDP echo guest with passthrough interrupt mode (no emulated GIC),
# used to isolate the T3 0x48 MMIO fault to either the GIC config or the
# generated guest DTB.
[base]
id = 2
name = "arceos-net-passthrough"
vm_type = 1
cpu_num = 1
phys_cpu_ids = [3]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "/home/huhu/tgoskits-net/tmp/axbuild/rootfs/qemu-aarch64/arceos/arceos-udpecho.bin"
kernel_load_addr = 0x8020_0000
dtb_path = "/home/huhu/tgoskits-net/scripts/test/net-dual-guest/pci-virt.dtb"
dtb_load_addr = 0x8020_0000
memory_regions = [
  [0x8020_0000, 0x0800_0000, 0x7, 2],
]

[devices]
interrupt_mode = "passthrough"
passthrough_devices = [
  ["/pl011@9000000"],
  ["/intc@8000000"],
  ["/timer"],
  ["/virtio_mmio@a000000"],
]
passthrough_addresses = [
  [0x0a00_0000, 0x200],
]
excluded_devices = []
emu_devices = []
